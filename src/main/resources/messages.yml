# MiniMessage formatting is supported. Text is styled and never italic.
prefix: "<bold><gradient:#37BFF8:#A855F7>✦ SUPA RTP</gradient></bold> <dark_gray>» "
no-permission: "<gradient:#FF6961:#FF9A44><bold>✖ You don't have permission to use this.</bold></gradient>"
player-only: "<gradient:#FF6961:#FF9A44><bold>✖ This command can only be used by a player.</bold></gradient>"
unknown-destination: "<gradient:#FF6961:#FF9A44><bold>✖ Unknown destination.</bold></gradient> <gray>Use <white>/rtp</white> to open the menu."
world-unavailable: "<gradient:#FF6961:#FF9A44><bold>✖ That destination world is not loaded or configured.</bold></gradient>"
cooldown: "<gradient:#FF6961:#FF9A44><bold>⏳ RTP cooldown:</bold></gradient> <gradient:#37BFF8:#A855F7><bold><time></bold></gradient><gray> remaining."
already-teleporting: "<gradient:#FF6961:#FF9A44><bold>✖ You're already teleporting!</bold></gradient>"
