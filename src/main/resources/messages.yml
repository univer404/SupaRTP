finding-location: "<gradient:#37BFF8:#A855F7><bold>⌕ Finding a safe random location...</bold></gradient>"
cancelled-move: "<gradient:#FF6961:#FF9A44><bold>✖ Teleport cancelled because you moved.</bold></gradient>"
cancelled: "<gradient:#FF6961:#FF9A44><bold>✖ Teleport cancelled.</bold></gradient>"
no-safe-location: "<gradient:#FF6961:#FF9A44><bold>✖ Couldn't find a safe location. Please try again.</bold></gradient>"
success: "<gradient:#55E86B:#B8FF8A><bold>✔ Successfully teleported to a random location!</bold></gradient>"
reloaded: "<gradient:#55E86B:#B8FF8A><bold>✔ SupaRTP configuration reloaded.</bold></gradient>"
