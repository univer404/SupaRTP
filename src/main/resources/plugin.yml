name: SupaRTP
version: 1.0.0
main: com.supar.tp.SupaRTP
api-version: '1.21'
description: Configurable random teleportation for the Overworld, Nether, and End.
author: univer404
commands:
  rtp:
    description: Open the random teleport menu or start a random teleport.
    usage: /rtp [world|world_nether|world_the_end]
    aliases: [wild]
permissions:
  supar.tp.use:
    description: Allows using SupaRTP.
    default: true
  supar.tp.admin:
    description: Allows reloading SupaRTP configuration.
    default: op